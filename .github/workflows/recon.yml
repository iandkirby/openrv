#
# Lightweight reconnaissance: fetch upstream OpenRV and publish its ffmpeg
# dependency recipe (codec enable/disable mechanism) to the ci-logs branch.
# Trigger by committing a change to .ci-recon.

name: recon

on:
  push:
    branches: ["claude/studio-sequence-openrv-3yxvsx"]
    paths: [".ci-recon"]

permissions:
  contents: write

jobs:
  ffmpeg-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream and extract ffmpeg codec mechanism
        run: |
          SEQ_OPENRV_TAG=v3.2.0 bash scripts/get_openrv.sh
          mkdir -p _ci
          find _external/OpenRV/cmake -iname '*ffmpeg*' -o -iname '*codec*' | tee _ci/ffmpeg-recon-index.txt
          while IFS= read -r f; do
            [ -f "$f" ] && cp "$f" "_ci/openrv-$(basename "$f")"
          done < _ci/ffmpeg-recon-index.txt
          grep -rn -i "non_free\|non-free\|nonfree\|enable-decoder\|disable-decoder\|enable-encoder\|disable-encoder\|hevc\|h264\|aac" \
            _external/OpenRV/cmake 2>/dev/null | head -120 > _ci/ffmpeg-codec-grep.txt || true
          # Round 2: where the base configure options come from, and whether
          # the mio_ffmpeg plugin gates codecs at runtime.
          grep -rn "RV_FFMPEG_COMMON_CONFIG_OPTIONS" _external/OpenRV/cmake 2>/dev/null | head -20 > _ci/ffmpeg-common-options-where.txt || true
          COMMON_FILE="$(grep -rl "RV_FFMPEG_COMMON_CONFIG_OPTIONS" _external/OpenRV/cmake --include='*.cmake' | grep -v dependencies/ffmpeg.cmake | head -n1)"
          [ -n "$COMMON_FILE" ] && cp "$COMMON_FILE" "_ci/openrv-common-$(basename "$COMMON_FILE")"
          grep -rn -i "hevc\|h265" \
            _external/OpenRV/src/lib/image/MovieFFMpeg _external/OpenRV/src/lib/image/mio_ffmpeg \
            2>/dev/null | head -60 > _ci/mio-ffmpeg-hevc-grep.txt || true
          grep -rn -i "allowed\|whitelist\|blacklist\|codecIsAllowed\|supported.*codec\|codec.*supported" \
            _external/OpenRV/src/lib/image/MovieFFMpeg _external/OpenRV/src/lib/image/mio_ffmpeg \
            2>/dev/null | head -80 > _ci/mio-ffmpeg-allowlist-grep.txt || true
          find _external/OpenRV/src -type d -iname '*ffmpeg*' > _ci/ffmpeg-src-dirs.txt 2>/dev/null || true
          git config user.name "seq-ci"
          git config user.email "software@thesequencegroup.com"
          git checkout -B ci-logs
          git add -f _ci
          git commit -m "ffmpeg codec recon (upstream v3.2.0)"
          git push -f origin ci-logs
