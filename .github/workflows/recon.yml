#
# Lightweight reconnaissance against pinned upstream OpenRV source; results
# publish to the ci-logs branch. Trigger by committing a change to .ci-recon.
# Round 5: hardware decode (VideoToolbox / DXVA / CUDA) + decoder threading.

name: recon

on:
  push:
    branches: ["claude/studio-sequence-openrv-3yxvsx"]
    paths: [".ci-recon"]

permissions:
  contents: write

jobs:
  hwdecode-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract hardware-decode and threading wiring
        run: |
          SEQ_OPENRV_TAG=v3.2.0 bash scripts/get_openrv.sh
          mkdir -p _ci
          SRC=_external/OpenRV/src/lib/image
          MFF=$SRC/MovieFFMpeg/MovieFFMpeg.cpp

          # 1) Full mio_ffmpeg init.cpp — where codecThreads/bruteForce come from
          cp $SRC/mio_ffmpeg/init.cpp _ci/mio-init-full.cpp || true

          # 2) All hw-decode references with generous context
          grep -n -i -B6 -A25 "videotoolbox\|hwaccel\|hw_device\|hwdevice\|d3d11\|dxva\|nvdec\|cuda\|hwframe" \
            "$MFF" 2>/dev/null | head -400 > _ci/mff-hwdecode-context.txt || true

          # 3) Threading: how thread_count is set
          grep -n -B6 -A15 "thread_count\|codecThreads\|thread_type" \
            "$MFF" $SRC/MovieFFMpeg/MovieFFMpeg/MovieFFMpeg.h 2>/dev/null | head -200 > _ci/mff-threads-context.txt || true

          # 4) Environment variables / settings the plugin reads
          grep -n -B2 -A8 "getenv\|Settings\|IOParameter" "$MFF" 2>/dev/null | head -250 > _ci/mff-settings-context.txt || true

          # 5) Build-level hw options in ffmpeg.cmake
          grep -n -B4 -A12 -i "videotoolbox\|hwaccel\|cuda\|nvenc\|nvdec\|d3d11\|dxva" \
            _external/OpenRV/cmake/dependencies/ffmpeg.cmake 2>/dev/null | head -150 > _ci/ffmpeg-cmake-hw-context.txt || true

          git config user.name "seq-ci"
          git config user.email "software@thesequencegroup.com"
          git checkout -B ci-logs
          git add -f _ci
          git commit -m "hw-decode + threading recon (upstream v3.2.0)"
          git push -f origin ci-logs
