#
# Builds the full Sequence RV distribution (rv + rvio + studio kit + branding)
# on GitHub-hosted runners and uploads the platform installer as an artifact.
#
# Trigger manually (Actions tab -> build-installers -> Run workflow) or via
# API. First runs double as reconnaissance: upstream's own build docs are
# printed into the log so the recipe can be tuned per pinned release.

name: build-installers

on:
  workflow_dispatch:
    inputs:
      openrv_tag:
        description: "OpenRV ref to build ('latest' = newest release tag, or a tag/branch)"
        required: false
        default: "latest"
      build_windows:
        description: "Build the Windows installer"
        type: boolean
        default: true
      build_macos:
        description: "Also build the macOS DMG"
        type: boolean
        default: false
  # Push-based trigger: commit a change to .ci-trigger with '[ci-win]' and/or
  # '[ci-mac]' in the commit message. Exists so builds can be started with
  # plain git when API access is unavailable.
  push:
    branches: ["claude/studio-sequence-openrv-3yxvsx"]
    paths: [".ci-trigger"]

# contents: write so failed builds can publish their error summaries to the
# ci-logs branch (diagnosable via plain git clone).
permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.build_windows) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-win]')) }}
    # windows-2022, NOT windows-latest: the -latest image (windows-2025) ships
    # only Visual Studio 2026, which OpenRV's build chain does not support —
    # run #4 (Qt headers vs new STL in nested builds) and run #5 (CPython's
    # PCbuild finding no known toolset, MSB8020 v140) were both symptoms.
    # windows-2022 provides the VS 2022 environment upstream targets.
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      # Short clone path at the drive root: upstream warns PySide compilation
      # fails from long paths (Windows 254-char limit).
      SEQ_OPENRV_DIR_WIN: 'D:\OpenRV'
      SEQ_OPENRV_DIR: '/d/OpenRV'
      RV_VFX_PLATFORM: CY2024
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # Upstream pins the MSVC toolset: rvcmds.sh configures with
      # "-T v143,version=14.40" (newer toolsets break the PySide build).
      # Ensure that exact toolset exists on the runner's VS 2022.
      - name: Ensure MSVC v143 14.40 toolset is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "VS at: $vs"
          $have = Get-ChildItem "$vs\VC\Tools\MSVC" -Name | Where-Object { $_ -like '14.40.*' }
          if ($have) { Write-Host "14.40 toolset already present: $have"; exit 0 }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList `
            'modify', '--installPath', "`"$vs`"", `
            '--add', 'Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64', `
            '--quiet', '--norestart', '--nocache'
          Get-ChildItem "$vs\VC\Tools\MSVC" -Name

      - name: Set up MSYS2 (utility shell — per upstream config_windows.md)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-make
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-toolchain
            autoconf
            automake
            bison
            flex
            git
            libtool
            nasm
            p7zip
            patch
            unzip
            zip

      # Qt BEFORE Python: install-qt-action drags in its own Python and
      # clobbers pythonLocation (run #1 ended up on 3.12 because of this).
      - name: Set up Qt 6.5.3 (VFX CY2024)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: "win64_msvc2019_64"
          modules: "qtwebengine qtwebchannel qtwebsockets qtmultimedia qtpositioning"
          cache: true

      - name: Set up Python 3.11 (VFX CY2024) + python3.exe shim
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create python3.exe shim and jom (per upstream doc)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:pythonLocation\python3.exe")) {
            Copy-Item "$env:pythonLocation\python.exe" "$env:pythonLocation\python3.exe"
          }
          if (-not (Get-Command jom -ErrorAction SilentlyContinue)) { choco install jom -y --no-progress }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Set up sccache (compile cache across attempts)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Resolve OpenRV ref and fetch source (short path)
        env:
          OPENRV_TAG_INPUT: ${{ inputs.openrv_tag }}
        run: |
          set -x
          if [ "${OPENRV_TAG_INPUT:-latest}" = "latest" ]; then
            TAG="$(git ls-remote --tags --refs https://github.com/AcademySoftwareFoundation/OpenRV.git 'v*' \
                   | awk -F/ '{print $NF}' | sort -V | tail -n1)"
          else
            TAG="$OPENRV_TAG_INPUT"
          fi
          echo "Building OpenRV ref: $TAG"
          echo "OPENRV_TAG=$TAG" >> "$GITHUB_ENV"
          SEQ_OPENRV_TAG="$TAG" bash scripts/get_openrv.sh

      - name: Recon — upstream common-build doc (read in log if needed)
        run: |
          for f in "$SEQ_OPENRV_DIR/docs/build_system/config_common_build.md"; do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(not present at this ref)"
            echo "::endgroup::"
          done
          echo "::group::tool versions"
          for t in python python3 cmake perl rustc cargo sccache; do
            printf '%-8s' "$t"; command -v "$t" && "$t" --version 2>/dev/null | head -n1 || echo "MISSING"
          done
          echo "::endgroup::"

      - name: Build OpenRV (rv + rvio) with Sequence branding and codecs
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # PATH order per upstream doc: Python (and cargo) ahead of
          # mingw64/bin, Strawberry Perl last.
          export PATH="$(cygpath -u "$pythonLocation"):$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH:/c/Strawberry/perl/bin"
          export ACLOCAL_PATH=/usr/share/aclocal
          export QT_HOME="$(cygpath -u "$QT_ROOT_DIR")"
          # rvcmds.sh defaults to the "Visual Studio 17 2022" generator, but
          # GitHub's windows-latest image ships only VS 2026 (v18). Match the
          # generator to the installed VS; the -T v143,version=14.40 toolset
          # pin still selects the exact compiler upstream requires (installed
          # into the VS instance by the earlier step).
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_MAJOR="$("$VSWHERE" -latest -products '*' -property installationVersion | cut -d. -f1 | tr -d '\r')"
          case "$VS_MAJOR" in
            18) export CMAKE_GENERATOR="Visual Studio 18 2026" ;;
            17) export CMAKE_GENERATOR="Visual Studio 17 2022" ;;
            *)  echo "warning: unrecognized VS major '$VS_MAJOR' — using rvcmds default generator" ;;
          esac
          echo "Using CMAKE_GENERATOR=${CMAKE_GENERATOR:-<rvcmds default>}"
          # Nested dependency builds (ExternalProject sub-cmakes) don't inherit
          # the top-level -T/-A flags; without these env vars they compile with
          # VS 2026's newest toolset, whose STL removed stdext:: — breaking
          # Qt 6.5.3 headers (run #4: imgui vs qvarlengtharray.h). CMake reads
          # these env vars for any configure that doesn't pass -T/-A explicitly.
          export CMAKE_GENERATOR_TOOLSET="v143,version=14.40"
          export CMAKE_GENERATOR_PLATFORM="x64"
          # CMake 4 refuses projects declaring cmake_minimum_required < 3.5;
          # some vendored dependency CMakeLists are that old. This env var is
          # CMake 4's official escape hatch.
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          bash scripts/build_openrv.sh

      - name: Build studio packages and bundle the distribution
        run: |
          export PATH="$(cygpath -u "$pythonLocation"):$PATH"
          make packages PY=python
          bash scripts/bundle_release.sh "$SEQ_OPENRV_DIR/_build/stage/app"

      - name: Build the installer (Inno Setup)
        shell: cmd
        run: scripts\make_installer_windows.cmd %SEQ_OPENRV_DIR_WIN%\_build\stage\app

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SequenceRV-windows-installer
          path: dist/SequenceRV-*-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build error logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-error-logs
          path: |
            D:\OpenRV\_build\build_errors.log
            D:\OpenRV\_build\error_summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish error summary to ci-logs branch on failure
        if: failure()
        run: |
          mkdir -p _ci
          tail -n 400 /d/OpenRV/_build/build_errors.log > _ci/windows-build-errors-tail.txt 2>/dev/null || true
          cp /d/OpenRV/_build/error_summary.txt _ci/windows-error_summary.txt 2>/dev/null || true
          git config user.name "seq-ci"
          git config user.email "software@thesequencegroup.com"
          git checkout -B ci-logs
          git add -f _ci
          git commit -m "Windows CI error logs (run ${GITHUB_RUN_NUMBER})" || exit 0
          git push -f origin ci-logs

  macos:
    name: macOS installer
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.build_macos) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-mac]')) }}
    # macos-15 (Xcode 16), NOT macos-latest: the latest image ships Xcode 26.5
    # whose SDK breaks the PySide6 build (run #8) — same pattern as the
    # windows-latest/VS2026 issue.
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          modules: "qtwebengine qtwebchannel qtwebsockets qtmultimedia qtpositioning"
          cache: true

      - name: Export QT_HOME for the OpenRV build
        run: |
          echo "QT_HOME=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          # Some dependency builds (AJA/ntv2 among them) look for the classic
          # QTDIR variable rather than OpenRV's QT_HOME; an unset QTDIR shows
          # up as an empty get_filename_component argument (run #9).
          echo "QTDIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install build utilities
        run: |
          brew install cmake ninja readline sqlite3 xz zlib tcl-tk autoconf \
                       automake libtool python-setuptools nasm meson glew || true

      - name: Resolve OpenRV ref and fetch source
        env:
          OPENRV_TAG_INPUT: ${{ inputs.openrv_tag }}
        run: |
          set -x
          if [ "${OPENRV_TAG_INPUT:-latest}" = "latest" ]; then
            TAG="$(git ls-remote --tags --refs https://github.com/AcademySoftwareFoundation/OpenRV.git 'v*' \
                   | awk -F/ '{print $NF}' | sort -V | tail -n1)"
          else
            TAG="$OPENRV_TAG_INPUT"
          fi
          echo "OPENRV_TAG=$TAG" >> "$GITHUB_ENV"
          SEQ_OPENRV_TAG="$TAG" bash scripts/get_openrv.sh

      - name: Recon — upstream build docs (read these in the log)
        run: |
          for f in \
            _external/OpenRV/docs/build_system/config_macos.md \
            _external/OpenRV/rvcmds.sh \
            _external/OpenRV/requirements.txt
          do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(not present at this ref)"
            echo "::endgroup::"
          done

      - name: Install upstream Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f _external/OpenRV/requirements.txt ]; then
            python -m pip install -r _external/OpenRV/requirements.txt
          fi

      - name: Build OpenRV (rv + rvio)
        run: |
          # The AJA SDK's configure does get_filename_component on
          # ${CMAKE_OSX_SYSROOT}, which is empty in nested configures on this
          # image (runs #8-#10). CMake initializes it from $SDKROOT.
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          bash scripts/build_openrv.sh

      - name: Bundle and build the DMG
        run: |
          make packages PY=python
          bash scripts/bundle_release.sh
          bash scripts/make_installer_macos.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SequenceRV-macos-installer
          path: dist/SequenceRV-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish error summary + recon to ci-logs branch
        if: always()
        run: |
          mkdir -p _ci
          B=_external/OpenRV/_build
          tail -n 400 "$B/build_errors.log" > _ci/macos-build-errors-tail.txt 2>/dev/null || true
          cp "$B/error_summary.txt" _ci/macos-error_summary.txt 2>/dev/null || true
          grep -n -B3 -A25 "CMake Error" "$B/build_errors.log" 2>/dev/null | head -200 > _ci/macos-cmake-errors.txt || true
          grep -n -B4 -A6 -E "error:|fatal error" "$B/build_errors.log" 2>/dev/null | head -300 > _ci/macos-compile-errors.txt || true
          # Recon for the AJA configure failure: OpenRV's dependency recipe
          # and the downloaded SDK's CMakeOptions.cmake (line ~54 is where
          # run #9 died) — lets the exact fix be authored without API access.
          for f in _external/OpenRV/cmake/dependencies/*.cmake; do
            case "$(basename "$f" | tr 'A-Z' 'a-z')" in
              *aja*|*ntv2*) cp "$f" "_ci/openrv-dep-$(basename "$f")" ;;
            esac
          done
          AJA_OPT="$(find "$B" -path '*AJA*' -name 'CMakeOptions.cmake' 2>/dev/null | head -n1)"
          if [ -n "$AJA_OPT" ]; then
            sed -n '1,90p' "$AJA_OPT" > _ci/aja-CMakeOptions-head.txt
          fi
          git config user.name "seq-ci"
          git config user.email "software@thesequencegroup.com"
          git checkout -B ci-logs
          git add -f _ci
          git commit -m "macOS CI logs+recon (run ${GITHUB_RUN_NUMBER}, ${{ job.status }})" || exit 0
          git push -f origin ci-logs
