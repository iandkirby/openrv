<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Sequence">
  <!-- Vector recreation of the Sequence circle wordmark (see logo_master.png
       for the supplied raster original). Regenerate raster assets with
       scripts/make_brand_assets.py after editing. -->
  <circle cx="256" cy="256" r="256" fill="#0b0b0d"/>
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="square">
    <text x="256" y="238" font-family="'Eurostile', 'Bank Gothic', 'Arial Narrow', sans-serif"
          font-size="96" font-weight="700" letter-spacing="6" fill="#ffffff" stroke="none"
          text-anchor="middle">SEQU</text>
    <text x="256" y="330" font-family="'Eurostile', 'Bank Gothic', 'Arial Narrow', sans-serif"
          font-size="96" font-weight="700" letter-spacing="6" fill="#ffffff" stroke="none"
          text-anchor="middle">ENCE</text>
  </g>
</svg>
